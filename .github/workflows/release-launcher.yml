name: Publish DoorC Launcher

on:
  push:
    tags:
      - launcher-v*

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Read launcher version from tag
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^launcher-v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Release tag must be launcher-vMAJOR.MINOR.PATCH."
          }
          Add-Content -Path $env:GITHUB_ENV -Value "LAUNCHER_VERSION=$version" -Encoding utf8

      - name: Build Windows installer
        shell: pwsh
        run: .\gradlew.bat :doorc-launcher:launcherExe "-PlauncherVersion=$env:LAUNCHER_VERSION"

      - name: Create SHA-256 checksum
        shell: pwsh
        run: |
          $installer = "doorc-launcher\build\launcher-package\DoorCLauncher-$env:LAUNCHER_VERSION.exe"
          $checksumFile = "$installer.sha256"
          $hash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText(
            (Join-Path $PWD $checksumFile),
            "$hash  $([System.IO.Path]::GetFileName($installer))`n",
            [System.Text.Encoding]::ASCII)

      - name: Publish stable release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = "doorc-launcher\build\launcher-package\DoorCLauncher-$env:LAUNCHER_VERSION.exe"
          gh release create $env:GITHUB_REF_NAME $installer "$installer.sha256" `
            --title "DoorC Launcher $env:LAUNCHER_VERSION" --generate-notes
