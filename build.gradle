plugins {
    id 'fabric-loom'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://maven.terraformersmc.com/releases/' }
    mavenCentral()
}

base {
    archivesName = project.archives_base_name
}

loom {
    accessWidenerPath = file('src/main/resources/crystal-utility.accesswidener')
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    modImplementation "com.terraformersmc:modmenu:${project.modmenu_version}"
    implementation project(':wvlib')
    include(implementation('net.java.dev.jna:jna:5.17.0'))
    include(implementation('net.java.dev.jna:jna-platform:5.17.0'))
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'wvlib_version', project.wvlib_version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version, 'wvlib_version': project.wvlib_version
    }
}

tasks.named('build') {
    dependsOn ':wvlib:build'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}
